# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack on `rsa`. Transitive via jsonwebtoken.
    # Not exploited here: JWT verification uses the JWKS *public* key only,
    # never private-key RSA decryption, which is the path Marvin targets.
    # No patched `rsa` release exists yet.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0367/0368/0369 — `zip` 3.0.0 extract() issues; build-time
    # only via utoipa-swagger-ui unpacking its bundled zip. Needs zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # RUSTSEC-2026-0387 — crypto-bigint 0.5.5 timing, via jsonwebtoken's
    # p256/p384. Public-key verification only; needs a breaking RustCrypto bump.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
