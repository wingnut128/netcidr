[package]
name = "netcidr"
version = "0.19.3"
edition = "2024"
license = "MIT"
description = "A fast IPv4 and IPv6 subnet calculator CLI and API"
repository = "https://gitlab.com/mlapane/netcidr"
keywords = ["ip", "subnet", "calculator", "ipv4", "ipv6"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tower-http = { version = "0.6", features = ["trace", "timeout", "cors", "set-header", "limit"] }
tower_governor = "0.8"
toml = "1.1"
csv = "1"
serde-saphyr = "0.0"
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
dirs = "6"
rmcp = { version = "1.3", features = ["server", "transport-io", "transport-streamable-http-server", "macros"], optional = true }
daemonize = "0.5"
tokio-util = { version = "0.7", features = ["rt"], optional = true }
schemars = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"], optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
ipnet = { version = "2", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }

# OpenAPI/Swagger dependencies
utoipa = { version = "5", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[features]
default = ["swagger", "dashboard"]
dashboard = []
swagger = ["dep:utoipa", "dep:utoipa-swagger-ui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:ipnet"]
mcp = ["dep:rmcp", "dep:schemars", "dep:reqwest", "dep:tokio-util"]
ipam-postgres = ["dep:sqlx"]

[profile.release]
lto = true
codegen-units = 1
strip = true
