version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # init/analyze/upload-sarif must run the same version or CodeQL fails.
      codeql-action:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      # Must precede cargo-minor-and-patch: a dependency joins the first group
      # it matches. No update-types filter, so 0.x minor bumps stay together.
      opentelemetry:
        patterns: ["opentelemetry*", "tracing-opentelemetry"]
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: "bun"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      # chainguard/static is only published as `:latest`, so every update is
      # a digest refresh, which Digestabot owns (workflows/digestabot.yml).
      # Letting Dependabot bump it too opened duplicate PRs (#445 / #446).
      - dependency-name: "chainguard/static"
