version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # init/analyze/upload-sarif must run the same version or CodeQL fails.
      codeql-action:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      # Must precede cargo-minor-and-patch: a dependency joins the first group
      # it matches. No update-types filter, so 0.x minor bumps stay together.
      opentelemetry:
        patterns: ["opentelemetry*", "tracing-opentelemetry"]
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: "bun"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # Also refreshes `tag@sha256:` digests when a tag's image changes (e.g.
    # chainguard/static:latest). Dependabot's commits are signed by GitHub,
    # which `main`'s required-signatures rule needs; Digestabot's weren't (#469).
