name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.19.4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and attach binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-

      - name: Validate tag format
        run: |
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '$RELEASE_TAG' is not vX.Y.Z"
            exit 1
          fi

      - name: Validate Cargo.toml version matches tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build dashboard
        run: cd dashboard && bun install --frozen-lockfile && bun run build

      - name: Build release binary
        run: cargo build --release --features mcp,tui,ipam-postgres

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: target/release/netcidr

      - name: Upload binary and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # release-plz normally creates the release as a draft so we can
          # attach the binary before publishing. If the draft is missing
          # (e.g. release-plz failed, or the tag was pushed manually),
          # create the release on the fly using the changelog section
          # for the tag as the release notes. RELEASE_TAG was already
          # validated to match ^v[0-9]+\.[0-9]+\.[0-9]+$ above.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            VERSION="${RELEASE_TAG#v}"
            NOTES_FILE="$(mktemp)"
            awk -v v="## \\[$VERSION\\]" '
              $0 ~ v {flag=1; next}
              /^## \[/ {flag=0}
              flag {print}
            ' CHANGELOG.md > "$NOTES_FILE"
            if [ ! -s "$NOTES_FILE" ]; then
              echo "Release $RELEASE_TAG missing and no CHANGELOG section found for $VERSION" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$NOTES_FILE" --draft
          fi
          gh release upload "$RELEASE_TAG" target/release/netcidr --clobber
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Dispatch netcidr-deploy
        # Tell wingnut128/netcidr-deploy to roll out the new tag. The
        # default GITHUB_TOKEN can't trigger workflows in other repos, so
        # this uses a fine-grained PAT scoped to netcidr-deploy with
        # Contents: read+write (required by the repository_dispatch API).
        # RELEASE_TAG is already validated to match ^v[0-9]+\.[0-9]+\.[0-9]+$
        # by the earlier step, and jq --arg encodes it safely into JSON.
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          jq -n --arg ref "$RELEASE_TAG" \
            '{event_type: "netcidr-released", client_payload: {ref: $ref}}' \
            | gh api -X POST repos/wingnut128/netcidr-deploy/dispatches --input -
          echo "Dispatched netcidr-released for $RELEASE_TAG"
