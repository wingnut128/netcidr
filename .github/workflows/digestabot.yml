name: Update Image Digests

# Refreshes the `@sha256:…` digests pinned in the Dockerfile (and in any GitHub
# Actions workflow) by resolving the corresponding tag (e.g. `:latest`,
# `:1-alpine`, `:1.95-alpine3.23`) against the upstream registry and opening a
# PR when the digest has drifted. Complements `dependabot.yml`'s `docker` and
# `github-actions` ecosystems, which handle *tag* bumps; digestabot handles
# *digest* refreshes for already-pinned references.
#
# Rationale: pinning by digest gives reproducibility and supply-chain defense,
# but pins rot if the upstream registry GC's the digest or if a critical CVE
# fix ships to a newer digest under the same tag. Without an automated refresh
# loop, the pin becomes a liability. Digestabot turns the refresh into a
# reviewable PR that goes through CI + branch protection like any other change.

on:
  schedule:
    # Daily 06:00 UTC. Chainguard rotates `static` digests frequently as
    # security patches ship, so daily catches drift quickly. The job is a
    # near-no-op on days with no drift (it walks the file, queries the
    # registry, exits clean).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-digests:
    name: Refresh pinned image digests
    runs-on: ubuntu-latest
    permissions:
      # Required so digestabot can create a branch and open a PR. Same scope
      # as Dependabot. Branch protection on `main` still gates the merge.
      contents: write
      pull-requests: write
      # Required by `use-gitsign: true` (digestabot's default): the OIDC
      # token is exchanged with Sigstore/Fulcio to sign the commit, which is
      # required because `main` enforces `required_signatures`.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chainguard-dev/digestabot@33d0b78e580aa0c83fe188eb3dfad6611b662479 # v1.3.2
        with:
          title-for-pr: 'chore(docker): refresh pinned image digests'
          commit-message: |
            chore(docker): refresh pinned image digests

            Auto-generated by digestabot. Resolves the upstream tag for each
            pinned image and bumps the `@sha256:…` reference to the current
            digest. Review the changelog of the affected image (Chainguard,
            oven/bun, library/rust, GitHub Actions) before merging.
          branch-for-pr: digestabot/refresh-digests
          labels-for-pr: dependencies
          # `use-gitsign: true` is the default and is required: branch
          # protection on `main` enforces `required_signatures`, so the
          # bot must produce a Sigstore-verifiable signature.
