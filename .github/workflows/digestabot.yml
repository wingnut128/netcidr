name: Update Image Digests

# Refreshes the `@sha256:…` digests pinned in the Dockerfile (and in any GitHub
# Actions workflow) by resolving the corresponding tag (e.g. `:latest`,
# `:1-alpine`, `:1.95-alpine3.23`) against the upstream registry and opening a
# PR when the digest has drifted. Complements `dependabot.yml`'s `docker` and
# `github-actions` ecosystems, which handle *tag* bumps; digestabot handles
# *digest* refreshes for already-pinned references.
#
# Rationale: pinning by digest gives reproducibility and supply-chain defense,
# but pins rot if the upstream registry GC's the digest or if a critical CVE
# fix ships to a newer digest under the same tag. Without an automated refresh
# loop, the pin becomes a liability. Digestabot turns the refresh into a
# reviewable PR that goes through CI + branch protection like any other change.

on:
  schedule:
    # Daily 06:00 UTC. Chainguard rotates `static` digests frequently as
    # security patches ship, so daily catches drift quickly. The job is a
    # near-no-op on days with no drift (it walks the file, queries the
    # registry, exits clean).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-digests:
    name: Refresh pinned image digests
    runs-on: ubuntu-latest
    permissions:
      # Required so digestabot can create a branch and open a PR when it falls
      # back to the default `GITHUB_TOKEN` (see the token note below). Same
      # scope as Dependabot. Branch protection on `main` still gates the merge.
      contents: write
      pull-requests: write
      # Required by `use-gitsign: true` (digestabot's default): the OIDC
      # token is exchanged with Sigstore/Fulcio to sign the commit, which is
      # required because `main` enforces `required_signatures`.
      id-token: write
    steps:
      # Warn loudly rather than fail: a missing secret still produces a useful
      # digest diff, it just produces one nobody can merge. Failing the job
      # outright would also stop the refresh loop entirely.
      - name: Warn if the PR token is missing
        env:
          DIGESTABOT_TOKEN: ${{ secrets.DIGESTABOT_TOKEN }}
        run: |
          if [ -z "${DIGESTABOT_TOKEN}" ]; then
            echo "::warning title=DIGESTABOT_TOKEN is not set::Falling back to the default GITHUB_TOKEN. GitHub does not dispatch workflow runs for events raised by that token, so the digest-refresh PR will open with no CI attached and can never satisfy branch protection. Set the DIGESTABOT_TOKEN repository secret."
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Must match the token handed to digestabot below, so the credential
          # persisted by checkout is the one used to push the branch.
          token: ${{ secrets.DIGESTABOT_TOKEN || github.token }}
      - uses: chainguard-dev/digestabot@33d0b78e580aa0c83fe188eb3dfad6611b662479 # v1.3.2
        with:
          # A PR opened with the default `GITHUB_TOKEN` does not trigger
          # workflow runs — GitHub suppresses them to stop workflows recursing
          # into themselves. That left every digest-refresh PR sitting with no
          # CI at all, and `main` requires status checks to pass, so the PR was
          # unmergeable and silently rotted (see #369, open with zero checks
          # since 2026-09-01).
          #
          # `DIGESTABOT_TOKEN` is a `repo`-scoped PAT belonging to a human or
          # machine account, mirroring `RELEASE_PLZ_TOKEN` in release-plz.yml —
          # it may even hold the same value. Events raised by a PAT are
          # attributed to that account rather than to `github-actions[bot]`, so
          # the usual `pull_request` workflows fire.
          #
          # The `||` fallback keeps the refresh working when the secret is
          # absent, at the cost of the no-CI behaviour above; the guard step
          # surfaces that as a warning annotation.
          token: ${{ secrets.DIGESTABOT_TOKEN || github.token }}
          title-for-pr: 'chore(docker): refresh pinned image digests'
          commit-message: |
            chore(docker): refresh pinned image digests

            Auto-generated by digestabot. Resolves the upstream tag for each
            pinned image and bumps the `@sha256:…` reference to the current
            digest. Review the changelog of the affected image (Chainguard,
            oven/bun, library/rust, GitHub Actions) before merging.
          branch-for-pr: digestabot/refresh-digests
          labels-for-pr: dependencies
          # `use-gitsign: true` is the default and is required: branch
          # protection on `main` enforces `required_signatures`, so the
          # bot must produce a Sigstore-verifiable signature.
