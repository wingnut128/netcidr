name: Close External PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close-if-external:
    runs-on: ubuntu-latest
    steps:
      - name: Check author permission
        id: check
        uses: actions-cool/check-user-permission@v2
        with:
          require: "write"
          username: ${{ github.event.pull_request.user.login }}

      - name: Close and comment
        if: steps.check.outputs.require-result == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `Thank you for your interest, @${pr.user.login}! This repository is not currently accepting external contributions. This PR has been automatically closed.\n\nIf you've found a bug or have a feature request, please open an issue instead.`
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });
