name: Security Audit (main)

# Full-tree advisory scan of main, on every push and daily. This is where a
# new advisory against an existing dependency surfaces: it opens a
# `security` issue (one at a time), comments when the set of advisories
# changes, and closes the issue once main is clean. It is deliberately not
# a PR check; ci.yml's audit job gates PRs only on advisories they
# introduce, so a fix can always merge.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Full-tree audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@dfd6a81ff1efc1c100332d760e0c9edfe2ae0a51 # cargo-audit
        with:
          tool: cargo-audit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Audit
        id: audit
        run: |
          set -euo pipefail
          if .github/scripts/audit-ids.sh . | sort -u > ids.txt; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi

      - name: Open, update or close the security issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.audit.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Security audit failing on main"
          gh label create security --color B60205 \
            --description "Security advisories" 2>/dev/null || true
          existing=$(gh issue list --state open --label security \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')

          if [ "$STATUS" = ok ] && [ ! -s ids.txt ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Clean as of $GITHUB_SHA ($RUN_URL)."
            fi
            exit 0
          fi

          if [ "$STATUS" = ok ]; then
            fingerprint=$(paste -sd ' ' ids.txt)
          else
            fingerprint="audit-error"
          fi
          {
            echo "<!-- advisories: $fingerprint -->"
            if [ "$STATUS" = ok ]; then
              echo "\`main\` at $GITHUB_SHA has advisories that fail the audit policy:"
              echo
              while read -r id; do
                case "$id" in
                  RUSTSEC-*) echo "- [$id](https://rustsec.org/advisories/$id.html)" ;;
                  GHSA-*) echo "- [$id](https://github.com/advisories/$id)" ;;
                  *) echo "- $id" ;;
                esac
              done < ids.txt
            else
              echo "The audit of \`main\` at $GITHUB_SHA could not complete (a tool produced no usable output). Treat it as failing until it runs clean."
            fi
            echo
            echo "Fix on main by bumping, or accept with a rationale in \`deny.toml\` + \`.cargo/audit.toml\` (Rust) or \`dashboard/.bun-audit-ignore\` (dashboard). Then merge the Release PR and deploy."
            echo
            echo "Run: $RUN_URL"
          } > body.md

          if [ -z "$existing" ]; then
            gh issue create --title "$title" --label security --body-file body.md
          else
            previous=$(gh issue view "$existing" --json body --jq .body \
              | sed -n 's/^<!-- advisories: \(.*\) -->$/\1/p')
            gh issue edit "$existing" --body-file body.md
            # Comment (and so notify) only when the set changes.
            if [ "$previous" != "$fingerprint" ]; then
              gh issue comment "$existing" --body "Advisories changed: $fingerprint ($RUN_URL)"
            fi
          fi
          exit 1

  image-updates:
    # A manual run on a feature branch must not close main's tracking issue.
    if: github.ref == 'refs/heads/main'
    name: Chainguard image freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compare Dockerfile pins with the registry
        run: |
          # Retain the report on stale pins or lookup errors so tracking runs.
          python3 .github/scripts/image_updates.py > image-updates.json || true
          jq -e '.status | IN("current", "not-applicable", "stale", "error")' image-updates.json
          {
            echo '### Chainguard image freshness'
            echo '```json'
            cat image-updates.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Track stale pins and lookup failures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Chainguard image updates pending on main"
          gh label create security --color B60205 --description "Security advisories" 2>/dev/null || true
          existing=$(gh issue list --state open --label security --search "\"$title\" in:title" \
            --json number,title --jq '.[] | select(.title == "Chainguard image updates pending on main") | .number' | head -1)
          status=$(jq -r .status image-updates.json)
          if [ "$status" = current ] || [ "$status" = not-applicable ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Dockerfile pins are current (or no longer use Chainguard) on main at $GITHUB_SHA. This confirms source freshness only; release and deployment must still be verified. $RUN_URL"
            fi
            exit 0
          fi
          fingerprint=$(sha256sum image-updates.json | cut -d ' ' -f1)
          {
            echo "<!-- image-updates: $fingerprint -->"
            echo "Chainguard freshness audit on main: **$status**."
            echo
            echo '```json'
            cat image-updates.json
            echo '```'
            echo
            echo 'For stale pins, update the Dockerfile through a signed PR, verify both supported architectures and scan the rebuilt image. Check closed Dependabot PRs if updates have stalled. A newer digest is an available update, not proof of a CVE.'
            echo
            echo 'For lookup errors, restore the check; do not treat missing results as up to date. Keep remediation tracked through merge, release, and deployment.'
            echo
            echo "Commit: $GITHUB_SHA. Run: $RUN_URL"
          } > image-updates.md
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --label security --body-file image-updates.md
          else
            previous=$(gh issue view "$existing" --json body --jq .body | sed -n 's/^<!-- image-updates: \(.*\) -->$/\1/p')
            gh issue edit "$existing" --body-file image-updates.md
            if [ "$previous" != "$fingerprint" ]; then
              gh issue comment "$existing" --body "Chainguard audit changed: $status. $RUN_URL"
            fi
          fi
          exit 1
