name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: step-security/paths-filter@5c5241b8233e77b55b9046daf88f1cb7560281de # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - "src/**"
              - "tests/**"
              - "dashboard/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "justfile"
              - "Dockerfile"
              - ".github/workflows/**"

  verify:
    name: Format, Lint & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1
          sudo docker image prune -af >/dev/null 2>&1
          df -h / | tail -1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@dfd6a81ff1efc1c100332d760e0c9edfe2ae0a51 # nextest
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: verify-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: verify-${{ runner.os }}-
      - uses: step-security/setup-bun@c2c3ca3b28b446447c25a2a39061f4bd64b729c8 # v2.1.2
      - name: Build dashboard
        run: cd dashboard && bun install --frozen-lockfile && bun run build
      - name: Audit dashboard npm deps
        working-directory: dashboard
        run: bun audit --audit-level=high
      - name: Check lockfile for known-compromised packages
        working-directory: dashboard
        env:
          # StepSecurity supply-chain advisory denylist. Add new entries as advisories arrive.
          DENYLIST: '"mbt" "@cap-js/sqlite"'
        run: |
          eval "set -- $DENYLIST"
          fail=0
          for pkg in "$@"; do
            if grep -F "\"$pkg" bun.lock >/dev/null 2>&1; then
              echo "::error file=dashboard/bun.lock::Compromised package present in lockfile: $pkg"
              fail=1
            fi
          done
          exit "$fail"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --features mcp,tui

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: taiki-e/install-action@dfd6a81ff1efc1c100332d760e0c9edfe2ae0a51 # cargo-audit
        with:
          tool: cargo-audit
      - run: cargo audit

  ci-status:
    name: CI Status
    needs: [changes, verify, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Aggregate required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          fail=0
          for job in changes verify audit; do
            var="${job^^}_RESULT"
            result="${!var}"
            case "$result" in
              success|skipped) echo "$job: $result" ;;
              *) echo "$job: $result (FAIL)"; fail=1 ;;
            esac
          done
          exit "$fail"
