name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -Eq '^(src/|tests/|dashboard/|Cargo\.toml$|Cargo\.lock$|justfile$|Dockerfile$|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Format, Lint & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1
          sudo docker image prune -af >/dev/null 2>&1
          df -h / | tail -1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@dfd6a81ff1efc1c100332d760e0c9edfe2ae0a51 # nextest
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: verify-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: verify-${{ runner.os }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build dashboard
        run: cd dashboard && bun install --frozen-lockfile && bun run build
      - name: Audit dashboard npm deps
        working-directory: dashboard
        run: bun audit --audit-level=high
      - name: Check lockfile for known-compromised packages
        working-directory: dashboard
        env:
          # Known-compromised package denylist. Add new entries as advisories arrive.
          DENYLIST: '"mbt" "@cap-js/sqlite"'
        run: |
          eval "set -- $DENYLIST"
          fail=0
          for pkg in "$@"; do
            if grep -F "\"$pkg" bun.lock >/dev/null 2>&1; then
              echo "::error file=dashboard/bun.lock::Compromised package present in lockfile: $pkg"
              fail=1
            fi
          done
          exit "$fail"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --features mcp,tui

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@dfd6a81ff1efc1c100332d760e0c9edfe2ae0a51 # cargo-audit
        with:
          tool: cargo-audit
      - run: cargo audit

  ci-status:
    name: CI Status
    needs: [changes, verify, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          fail=0
          for job in changes verify audit; do
            var="${job^^}_RESULT"
            result="${!var}"
            case "$result" in
              success|skipped) echo "$job: $result" ;;
              *) echo "$job: $result (FAIL)"; fail=1 ;;
            esac
          done
          exit "$fail"
