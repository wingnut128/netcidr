# cargo-audit configuration. Picked up automatically by `cargo audit`.

[advisories]
ignore = [
  # Marvin Attack — timing side-channel in the `rsa` crate. No fix has been
  # released upstream; the crate authors have stated they cannot mitigate
  # without rewriting the library.
  #
  # We pull `rsa` two ways:
  #   1. As a dev-dependency for ephemeral keypair generation in the Google
  #      ID token validation tests.
  #   2. Transitively through `jsonwebtoken` (with `rust_crypto` features),
  #      which uses it for RSA signature verification on incoming
  #      Google ID tokens.
  #
  # The Marvin Attack requires an attacker who can both submit ciphertexts
  # AND observe precise decryption timing. We never decrypt arbitrary
  # ciphertexts — we only verify RSA signatures on tokens, and verification
  # is a public-key operation with no exposed timing oracle. The advisory
  # is real but does not apply to our usage pattern.
  "RUSTSEC-2023-0071",
  # Timing variability in `crypto-bigint` 0.5, pulled in through
  # jsonwebtoken -> p256/p384 -> elliptic-curve 0.13. Unreachable: we only
  # accept RS256 (src/auth.rs rejects any other `alg` before verification),
  # so the ECDSA code that uses crypto-bigint never runs. The fix needs
  # elliptic-curve 0.14; jsonwebtoken 11.1.0 is the latest release and
  # still pins 0.13. Drop this once jsonwebtoken moves.
  "RUSTSEC-2026-0387",
]
