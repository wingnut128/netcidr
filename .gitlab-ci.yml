# GitLab CI/CD pipeline for netcidr
# Mirrors: fmt, lint, test, audit, semgrep, SAST, secret detection, dependency scanning, fuzz, release

stages:
  - check
  - test
  - security
  - fuzz
  - release

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Reduce build times on shared runners
  CARGO_INCREMENTAL: "0"

# Cache Cargo registry and build artifacts across jobs
.rust-cache: &rust-cache
  cache:
    key: "${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

# ---------------------------------------------------------------------------
# Stage: check
# ---------------------------------------------------------------------------

format:
  stage: check
  image: rust:latest
  <<: *rust-cache
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

lint:
  stage: check
  image: rust:latest
  <<: *rust-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm >/dev/null 2>&1
    - cd dashboard && npm ci --silent && npm run build && cd ..
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --all-features -- -D warnings

# ---------------------------------------------------------------------------
# Stage: test
# ---------------------------------------------------------------------------

test:
  stage: test
  image: rust:latest
  <<: *rust-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm >/dev/null 2>&1
    - cd dashboard && npm ci --silent && npm run build && cd ..
  script:
    - cargo test --features mcp,tui --verbose

# ---------------------------------------------------------------------------
# Stage: security
# ---------------------------------------------------------------------------

# GitLab SAST (replaces CodeQL)
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# cargo audit for Rust-specific vulnerability scanning
audit:
  stage: security
  image: rust:latest
  <<: *rust-cache
  script:
    - cargo install cargo-audit
    - cargo audit

semgrep:
  stage: security
  image: semgrep/semgrep:latest
  script:
    - semgrep scan --config=p/owasp-top-ten --config=p/rust --error .

# ---------------------------------------------------------------------------
# Stage: fuzz (scheduled only — runs weekly on Sunday at 2am UTC)
# ---------------------------------------------------------------------------

.fuzz-base:
  stage: fuzz
  image: rust:latest
  <<: *rust-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    FUZZ_DURATION: "60"
  before_script:
    - rustup toolchain install nightly
    - cargo install cargo-fuzz
  artifacts:
    when: on_failure
    paths:
      - fuzz/artifacts/
    expire_in: 30 days

fuzz_cidr_parsing:
  extends: .fuzz-base
  script:
    - cargo +nightly fuzz run fuzz_cidr_parsing -- -max_total_time=$FUZZ_DURATION

fuzz_from_range:
  extends: .fuzz-base
  script:
    - cargo +nightly fuzz run fuzz_from_range -- -max_total_time=$FUZZ_DURATION

fuzz_contains:
  extends: .fuzz-base
  script:
    - cargo +nightly fuzz run fuzz_contains -- -max_total_time=$FUZZ_DURATION

fuzz_subnet_ops:
  extends: .fuzz-base
  script:
    - cargo +nightly fuzz run fuzz_subnet_ops -- -max_total_time=$FUZZ_DURATION

# ---------------------------------------------------------------------------
# Stage: release (manual trigger via web UI or API)
# ---------------------------------------------------------------------------

release:
  stage: release
  image: rust:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION
      when: manual
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm >/dev/null 2>&1
  script:
    # Validate version format
    - |
      if ! echo "$RELEASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "ERROR: Invalid version format. Expected X.Y.Z (e.g. 0.15.0)"
        exit 1
      fi
    # Validate Cargo.toml version matches
    - |
      CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
      if [ "$CARGO_VERSION" != "$RELEASE_VERSION" ]; then
        echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match RELEASE_VERSION ($RELEASE_VERSION)"
        exit 1
      fi
    # Validate CHANGELOG entry exists
    - |
      if ! grep -q "^## \[$RELEASE_VERSION\]" CHANGELOG.md; then
        echo "ERROR: CHANGELOG.md has no entry for version $RELEASE_VERSION"
        exit 1
      fi
    # Extract release notes
    - |
      awk -v ver="$RELEASE_VERSION" '/^## \[/{if($0 ~ "\\[" ver "\\]"){found=1; next} else if(found) exit} found{print}' CHANGELOG.md > release_notes.md
      echo "Release notes:"
      cat release_notes.md
    # Build dashboard
    - cd dashboard && npm ci --silent && npm run build && cd ..
    # Build release binaries
    - cargo build --release
    # Create GitLab release via API
    - |
      curl --fail --header "PRIVATE-TOKEN: ${GITLAB_RELEASE_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"netcidr v${RELEASE_VERSION}\",
          \"tag_name\": \"v${RELEASE_VERSION}\",
          \"ref\": \"main\",
          \"description\": $(cat release_notes.md | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  artifacts:
    paths:
      - target/release/netcidr
    expire_in: 30 days
